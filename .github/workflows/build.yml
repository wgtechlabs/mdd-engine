name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Reusable workflows cannot increase the caller's permissions.
permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  build-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@260b9a063ef59ccc760155c19902320feb7e25cb # v0.3.1
    secrets: inherit
    with:
      ci-profile: node-bun
      ci-runtime-version: '24.21.0'
      ci-matrix-versions: '["22","24","26"]'
      # setup-bun reads packageManager: bun@1.3.10 from package.json.
      ci-setup-command: test "$(bun --version)" = '1.3.10'
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run lint
      ci-typecheck-command: bun run typecheck
      ci-test-command: bun run test
      ci-coverage-command: bun run coverage
      ci-build-command: bun run build && bun run smoke
      enable-package: true
      enable-release: true
      package-registry: both
      package-manager: bun
      release-package-manager: bun

      # Consumer policy: only main may publish after the release lock is removed.
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false

      # Hard release lock: v0.3.1 accepts success in only one registry.
      # package-publish-enabled also prevents source-finalize from committing/tagging.
      # Upgrade the reviewed upstream pin and meet docs/RELEASING.md first.
      package-publish-enabled: false
      release-create: false
